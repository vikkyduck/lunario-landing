# lunario.online — nginx (первичная HTTP-версия; HTTPS-блок добавляет certbot --nginx).
# Статика напрямую, всё остальное (/ с А/Б-логикой, /api, /admin, /politika, /soglasie)
# — прокси на lunario-api (127.0.0.1:5030).

server {
    listen 80;
    listen [::]:80;
    server_name lunario.online www.lunario.online;

    # certbot http-01
    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # статика — напрямую с диска
    location /assets/ {
        root /opt/lunario/site;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # всё остальное — Node (А/Б-вариант на /, api, админка, документы)
    location / {
        proxy_pass http://127.0.0.1:5030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 64k;
}
