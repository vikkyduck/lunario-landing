<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Лунарио — стеклянная луна и звёзды">
  <defs>
    <!-- жидкое стекло: полупрозрачное тело луны -->
    <radialGradient id="glassBody" cx="36%" cy="30%" r="85%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#f4dfa8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#c9a24b" stop-opacity=".05"/>
    </radialGradient>
    <radialGradient id="glassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e9c77e" stop-opacity=".30"/>
      <stop offset=".6" stop-color="#e9c77e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#e9c77e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#f4dfa8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <!-- мягкое свечение -->
  <circle cx="56" cy="60" r="54" fill="url(#glassGlow)"/>

  <!-- тело луны: прозрачное стекло -->
  <circle cx="56" cy="60" r="30" fill="url(#glassBody)"/>

  <!-- световая кромка, как у жидкого стекла -->
  <circle cx="56" cy="60" r="29.4" fill="none" stroke="url(#rimLight)" stroke-width="1.4"/>

  <!-- верхний блик -->
  <ellipse cx="46" cy="44" rx="14" ry="8" fill="#ffffff" opacity=".22" transform="rotate(-28 46 44)"/>
  <ellipse cx="70" cy="76" rx="9" ry="4.5" fill="#f4dfa8" opacity=".12" transform="rotate(-28 70 76)"/>

  <!-- глубина: едва заметные кратеры-вмятины -->
  <g fill="#ffffff" opacity=".07">
    <circle cx="62" cy="56" r="6"/>
    <circle cx="48" cy="68" r="4"/>
  </g>

  <!-- дуга звёзд -->
  <path d="M88 30 Q102 46 96 68" fill="none" stroke="#f4dfa8" stroke-width="1" stroke-linecap="round" opacity=".4"/>
  <g fill="#f8ecc8">
    <circle cx="88" cy="30" r="3"/>
    <circle cx="97" cy="46" r="2.1"/>
    <circle cx="96" cy="68" r="2.6"/>
  </g>
  <g fill="#e9c77e" opacity=".55">
    <circle cx="22" cy="26" r="1.4"/>
    <circle cx="16" cy="84" r="1.2"/>
    <circle cx="104" cy="94" r="1.3"/>
  </g>
</svg>
